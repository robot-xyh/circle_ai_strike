# Shared algorithm parameters for Profile A/B/C.
strike:
  target_class_name: UAV
  min_score: 0.45
  min_bbox_area: 200.0
  max_bbox_aspect_ratio: 2.0
  detection_stale_s: 0.4
  lost_timeout_s: 2.0

  dkf:
    enable: true
    process_accel_noise: 4.0
    meas_noise_px: 4.0
    predict_extra_delay_s: 0.03
    max_cov_trace: 0.25

  lateral_output_sign: 1.0
  longitudinal_output_sign: -1.0
  lateral_kp_rate: 3.0
  lateral_kd_rate: 0.5
  longitudinal_kp_rate: 3.0
  longitudinal_kd_rate: 0.5
  x_deadband: 0.020
  y_deadband: 0.020
  pixel_dot_lpf_tau_s: 0.25
  rate_lpf_tau_s: 0.05
  max_jerk_rad_s2: 20.0
  max_roll_rate_rad_s: 2.0
  max_pitch_rate_rad_s: 2.0
  waiting:
    level_kp: 1.5
  thrust:
    hover_scalar: 0.5
    constant_scalar: 0.55
  require_armed_to_command: true
  dry_run: false
